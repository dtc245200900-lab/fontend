<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid - SASS</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="gridcontainer">
    <div class="gridwrapper gridwrapper--header">
      <div class="gridcontent gridcontent--top"></div>
    </div>

    <div class="gridwrapper gridwrapper--main">
      <div class="gridcontent gridcontent--sidebar">
        <div class="sidebar-block"></div>
        <div class="sidebar-block"></div>
        <div class="sidebar-block"></div>
        <div class="sidebar-block"></div>
      </div>

      <div class="gridcontent gridcontent--empty"></div>
      <div class="gridcontent gridcontent--empty"></div>
      <div class="gridcontent gridcontent--empty"></div>
      <div class="gridcontent gridcontent--empty"></div>
      <div class="gridcontent gridcontent--empty"></div>
      <div class="gridcontent gridcontent--empty"></div>

      <div class="gridcontent gridcontent--right">
        <div class="right-block"></div>
      </div>
    </div>

    <div class="gridwrapper gridwrapper--footer">
      <div class="gridcontent gridcontent--bottom"></div>
    </div>
  </div>

  <div class="gridcontainer gridcontainer--guides" aria-hidden="true">
    <div class="gridwrapper gridwrapper--guide">
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
    </div>
  </div>

  <p class="hint">Thay đổi kích thước cửa sổ trình duyệt để quan sát bố cục grid responsive.</p>
</body>
</html>
