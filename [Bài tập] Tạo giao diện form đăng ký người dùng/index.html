<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Đăng ký người dùng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 250px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .gender {
            margin-left: 135px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #2196f3;
            color: white;
        }

        input[type="reset"] {
            background-color: #777;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Đăng ký người dùng</h2>

        <form action="http://demo.codegym.vn/6/registration_form/register.php"
              method="POST">

            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Nhập họ và tên">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>

                <div class="gender">
                    <input type="radio"
                           id="male"
                           name="gender"
                           value="Nam">
                    <label for="male" style="width: auto;">
                        Nam
                    </label>

                    <input type="radio"
                           id="female"
                           name="gender"
                           value="Nữ">
                    <label for="female" style="width: auto;">
                        Nữ
                    </label>
                </div>
            </div>

            <div class="buttons">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>

        </form>

    </div>

</body>
</html>
