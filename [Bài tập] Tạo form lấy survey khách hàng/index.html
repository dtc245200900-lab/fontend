<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Market Research Survey</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
        }

        .header {
            padding: 10px 20px;
            border-bottom: 1px dotted #ccc;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: normal;
        }

        .header p {
            margin: 10px 0;
            color: #555;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .survey {
            padding: 15px 20px;
        }

        .question {
            margin-bottom: 22px;
        }

        .question label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 60%;
            height: 30px;
            font-size: 16px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 10px;
        }

        .option {
            margin: 12px 0;
        }

        .other-input {
            margin-left: 30px;
            width: 175px;
            height: 22px;
        }

        .price {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .price input {
            height: 24px;
            font-size: 16px;
        }

        .dollars {
            width: 85px;
        }

        .cents {
            width: 25px;
        }

        .price-label {
            display: inline-block;
            margin-right: 35px;
            margin-top: 5px;
            font-size: 14px;
        }

        .features {
            margin-top: 25px;
        }

        textarea {
            width: 500px;
            height: 100px;
        }

        .submit-area {
            margin-top: 25px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Market Research Survey</h1>
        <p>Please take a few moments to complete this satisfaction survey.</p>
    </div>

    <form class="survey">

        <!-- Age -->
        <div class="question">
            <label class="title">What is your age range?</label>

            <select name="age">
                <option value="18-24">18-24</option>
                <option value="25-34">25-34</option>
                <option value="35-44">35-44</option>
                <option value="45-54">45-54</option>
                <option value="55+">55+</option>
            </select>
        </div>

        <!-- Income -->
        <div class="question">
            <label class="title">What is your yearly income range?</label>

            <select name="income">
                <option value="0-25000">$0 - $25,000</option>
                <option value="25001-50000">$25,001 - $50,000</option>
                <option value="50001-100000">$50,001 - $100,000</option>
                <option value="100000+">$100,000+</option>
            </select>
        </div>

        <!-- Gender -->
        <div class="question">
            <label class="title">Gender Identity</label>

            <div class="option">
                <input type="radio" name="gender" value="Male">
                Male
            </div>

            <div class="option">
                <input type="radio" name="gender" value="Female">
                Female
            </div>

            <div class="option">
                <input type="radio" name="gender" value="Nonbinary">
                Nonbinary
            </div>

            <div class="option">
                <input type="radio" name="gender" value="Other">
                Other
            </div>

            <input type="text" name="other_gender" class="other-input">
        </div>

        <!-- Products -->
        <div class="question">
            <label class="title">
                Which of the following products have your purchased in the last 2 months.
                Please check all that apply.
            </label>

            <div class="option">
                <input type="checkbox" name="product" value="Product 1">
                Product 1
            </div>

            <div class="option">
                <input type="checkbox" name="product" value="Product 2">
                Product 2
            </div>

            <div class="option">
                <input type="checkbox" name="product" value="Product 3">
                Product 3
            </div>
        </div>

        <!-- Frequency -->
        <div class="question">
            <label class="title">
                How often would you use our new product?
            </label>

            <div class="option">
                <input type="radio" name="frequency" value="Daily">
                Daily
            </div>

            <div class="option">
                <input type="radio" name="frequency" value="Weekly">
                Weekly
            </div>

            <div class="option">
                <input type="radio" name="frequency" value="Monthly">
                Monthly
            </div>
        </div>

        <!-- Price -->
        <div class="question">
            <label class="title">
                What would you pay for the new product?
            </label>

            <div class="price">
                <span>$</span>
                <input type="text" name="dollars" class="dollars">
                <span>.</span>
                <input type="text" name="cents" class="cents">
            </div>

            <div>
                <span class="price-label">Dollars</span>
                <span class="price-label">Cents</span>
            </div>
        </div>

        <!-- Features -->
        <div class="question features">
            <label class="title">
                What features would you like to see in the new product.
            </label>

            <textarea name="features"></textarea>
        </div>

        <div class="submit-area">
            <button type="submit">Submit</button>
        </div>

    </form>

</div>

</body>
</html>
