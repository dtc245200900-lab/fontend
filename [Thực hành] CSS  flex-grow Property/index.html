<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex Grow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            width: 800px;
            margin: 30px auto;
            border: 2px solid #333;
            padding: 10px;
            gap: 10px;
        }

        .box {
            height: 100px;
            flex-grow: 1;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Div thứ 2 phát triển gấp 3 lần */
        .box2 {
            flex-grow: 3;
        }
    </style>
</head>

<body>

    <h1>CSS flex-grow Property</h1>

    <h2>Ví dụ: flex-grow</h2>

    <div class="container">
        <div class="box">1</div>
        <div class="box box2">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>

</body>
</html>
