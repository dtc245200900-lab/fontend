<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row Gap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* Grid sử dụng grid-row-gap */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            /* Khoảng cách giữa các hàng */
            grid-row-gap: 30px;

            max-width: 800px;
        }

        .box {
            background-color: lightblue;
            border: 1px solid #333;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Grid - grid-row-gap</h1>

    <div class="grid">

        <div class="box">Ô 1</div>
        <div class="box">Ô 2</div>
        <div class="box">Ô 3</div>

        <div class="box">Ô 4</div>
        <div class="box">Ô 5</div>
        <div class="box">Ô 6</div>

        <div class="box">Ô 7</div>
        <div class="box">Ô 8</div>
        <div class="box">Ô 9</div>

    </div>

</body>
</html>
