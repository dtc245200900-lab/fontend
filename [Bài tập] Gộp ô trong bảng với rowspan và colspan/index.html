<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>

<body>

    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <!-- Thứ Hai có 2 cuộc họp -->
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>

        <!-- Thứ Ba có cuộc họp kéo dài nhiều giờ -->
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">09:00 - 12:00 - Họp toàn công ty</td>
        </tr>

        <!-- Thứ Tư có 2 cuộc họp -->
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>08:30 - 10:00</td>
            <td>Họp dự án</td>
        </tr>

        <tr>
            <td>15:00 - 16:00</td>
            <td>Họp nhân sự</td>
        </tr>

    </table>

</body>
</html>
